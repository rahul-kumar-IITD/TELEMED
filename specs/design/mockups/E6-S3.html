<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E6-S3 E2E and component test report view - Mockup</title>
<!-- E6-S3 is a test story with no end-user screen. This mockup is a representation of the test-run report (project x flow matrix, screenshot baselines, vitest list) so the coverage plan is reviewable. It calls no product API; the "API" labels show which endpoints each flow exercises. -->
<style>
:root{--paper:#f6f1e7;--card:#fffdf8;--ink:#14302f;--ink2:#41605d;--line:#d9cfba;--teal:#0f5c58;--teal2:#0b4643;--clay:#b4472b;--gold:#e7b53c;--ok:#1f6b3a;--okbg:#dcefe0;--warn:#7a5200;--warnbg:#fbeac2;--err:#8f2a14;--errbg:#f9ddd4;--info:#1d4e7a;--infobg:#dbe8f5}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI",Candara,"Gill Sans",sans-serif}
h1,h2,h3,.display{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0 0 .4em}
h1{font-size:1.9rem}h2{font-size:1.4rem}h3{font-size:1.1rem}
.mockbar{background:#1b1b1b;color:#eee;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:12px/1.2 ui-monospace,Consolas,monospace;position:sticky;top:0;z-index:50}
.mockbar b{color:var(--gold);margin-right:4px}
.mockbar button{background:#333;color:#eee;border:1px solid #555;border-radius:4px;padding:6px 10px;min-height:32px;font:inherit;cursor:pointer}
.mockbar button[aria-pressed=true]{background:var(--gold);color:#111;border-color:var(--gold)}
.api{display:inline-block;font:11px/1.3 ui-monospace,Consolas,monospace;background:#efe6cf;color:#5a4300;border:1px dashed #b9a15c;border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:middle;white-space:normal;overflow-wrap:anywhere;font-weight:400}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.topnav{background:var(--teal);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:8px 16px}
.topnav .brand{font-family:Georgia,serif;font-size:1.25rem;font-weight:700;margin-right:auto}
.topnav a,.topnav button{color:#fff;background:none;border:0;text-decoration:none;min-height:44px;min-width:44px;padding:0 8px;display:inline-flex;align-items:center;font:inherit;cursor:pointer;border-bottom:3px solid transparent}
.topnav a[aria-current=page]{border-bottom-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 #e8dfc9}
.grid{display:grid;gap:12px}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.sidebar{grid-template-columns:280px 1fr}}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid #8b9a96;border-radius:6px;background:#fff;color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
input[aria-invalid=true]{border-color:var(--clay);background:#fff6f3}
.btn{min-height:44px;min-width:44px;padding:8px 16px;border-radius:6px;border:1.5px solid var(--teal);background:var(--teal);color:#fff;font-weight:600;font-size:1rem;font-family:inherit;cursor:pointer}
.btn:hover:not(:disabled){background:var(--teal2)}
.btn.sec{background:transparent;color:var(--teal)}
.btn.danger{background:var(--clay);border-color:var(--clay)}
.btn.danger.sec{background:transparent;color:var(--clay)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.hint{font-size:.85rem;color:var(--ink2)}
.err{color:var(--err);font-size:.85rem;margin-top:3px}
.msg{padding:10px 12px;border-radius:6px;margin:10px 0;font-size:.92rem;border-left:5px solid}
.msg.err{background:var(--errbg);border-color:var(--clay);color:var(--err);font-size:.92rem}
.msg.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.msg.warn{background:var(--warnbg);border-color:var(--gold);color:var(--warn)}
.msg.info{background:var(--infobg);border-color:var(--info);color:var(--info)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;letter-spacing:.04em;border:1px solid}
.b-BOOKED{background:var(--infobg);color:var(--info);border-color:var(--info)}
.b-CHECKED_IN{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.b-IN_PROGRESS{background:#e8dcf5;color:#4b2a7a;border-color:#4b2a7a}
.b-COMPLETED{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.b-CANCELLED{background:#e7e2d6;color:#55503f;border-color:#55503f}
.b-NO_SHOW{background:var(--errbg);color:var(--err);border-color:var(--err)}
.b-AVAILABLE{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.b-BLOCKED{background:#e7e2d6;color:#55503f;border-color:#55503f}
.b-ACTIVE{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.b-INACTIVE{background:var(--errbg);color:var(--err);border-color:var(--err)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{justify-content:space-between}
.state{display:none}.state.on{display:block}
.skel{background:linear-gradient(90deg,#eadfc6,#f6efdd,#eadfc6);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px;height:18px;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:32px 12px;color:var(--ink2);border:2px dashed var(--line);border-radius:10px}
.fee{font-family:Georgia,serif;font-weight:700;font-size:1.1rem}
.sr{position:absolute;left:-9999px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.chip{min-height:44px;min-width:44px;padding:6px 12px;border:1.5px solid var(--teal);border-radius:8px;background:#fff;color:var(--teal);font-weight:600;font-size:.95rem;font-family:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--teal);color:#fff}.chip:disabled{opacity:.45;cursor:not-allowed;background:#eee;border-color:#aaa;color:#555}
.modal-bg{position:fixed;inset:0;background:rgba(20,48,47,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-bg.on{display:flex}.modal{background:var(--card);border-radius:10px;padding:20px;max-width:440px;width:100%}
@media(max-width:700px){.resp thead{display:none}.resp tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:6px;background:var(--card)}.resp td{display:block;border:0;padding:4px 8px}.resp td::before{content:attr(data-l);font-weight:700;font-size:.75rem;text-transform:uppercase;color:var(--ink2);display:block}}

.pass{color:var(--ok);font-weight:700}.fail{color:var(--err);font-weight:700}.na{color:var(--ink2)}
.shot{border:2px dashed var(--line);border-radius:8px;padding:10px;text-align:center;background:#fff;font-size:.85rem}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
</style></head>
<body>
<div class="mockbar" role="toolbar" aria-label="Mockup controls"><b>RUN</b><button data-r="pass" aria-pressed="true">All passing</button><button data-r="fail" aria-pressed="false">A failure</button><button data-r="loading" aria-pressed="false">Running</button><button data-r="empty" aria-pressed="false">No results</button></div>
<header class="topnav"><span class="brand">Telemed &middot; Test report</span></header>
<main class="wrap">
<div id="live" role="status" aria-live="polite" class="sr"></div>
<h1>E2E and component tests</h1>
<p class="hint">Playwright projects: <strong>desktop 1280px</strong> and <strong>mobile 375px</strong>, fixed timezone (Asia/Kolkata) and fixed clock. Command: <code>npx playwright test</code> / <code>npm test</code>.</p>
<div id="out"></div>
</main>
<script>
function $(s,r){return (r||document).querySelector(s)}function $$(s,r){return [...(r||document).querySelectorAll(s)]}
function live(msg){var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=msg},30)}
function bindBar(group,cb){$$('.mockbar [data-'+group+']').forEach(function(b){b.addEventListener('click',function(){$$('.mockbar [data-'+group+']').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');cb(b.dataset[group])})})}
function show(prefix,id){$$('.state[id^="'+prefix+'"]').forEach(function(e){e.classList.toggle('on',e.id===prefix+id)})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmtLocal(iso){var d=new Date(iso);var t=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});var z=(d.toLocaleTimeString([], {timeZoneName:'short'}).split(' ').pop());return t+' '+z}
function fmtDay(iso){return new Date(iso).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})}

var FLOWS=[
['Patient: search, pick slot, book, view, cancel or reschedule',['desktop','mobile'],'GET /api/doctors, GET /api/doctors/{doctor_id}/slots, POST /api/appointments, GET /api/appointments/mine, POST /api/appointments/{appointment_id}/cancel|reschedule'],
['Doctor: queue status changes, NO_SHOW disabled before start, add note after COMPLETED',['desktop'],'GET /api/doctors/me/queue, POST /api/appointments/{appointment_id}/status, POST /api/appointments/{appointment_id}/notes'],
['Admin: onboard doctor, deactivate then reactivate user',['desktop'],'POST /api/admin/doctors, GET /api/admin/users, PUT /api/admin/users/{user_id}/deactivate|reactivate']];
var VT=['60-minute disabled state','allowed_actions buttons','409 handling','401 redirect','not-found page','sessionStorage token'];
var SH=['login','register','doctor search','doctor detail','booking confirm','my appointments','profile','queue','slot calendar','appointment notes','onboarding','user list'];
var mode='pass';
function draw(){var b=$('#out');
 if(mode==='loading'){b.innerHTML='<div class="card"><div class="skel"></div><div class="skel"></div><div class="skel" style="width:50%"></div></div>';return}
 if(mode==='empty'){b.innerHTML='<div class="empty">No test results yet. Run <code>npx playwright test</code>.</div>';return}
 function cell(ok,i){return ok?'<span class="'+(mode==='fail'&&i===1?'fail':'pass')+'">'+(mode==='fail'&&i===1?'FAIL':'PASS')+'</span>':'<span class="na">not required</span>'}
 b.innerHTML='<div class="card"><h2>Playwright flows</h2><table class="resp"><thead><tr><th>Flow</th><th>desktop 1280</th><th>mobile 375</th><th>Endpoints exercised</th></tr></thead><tbody>'+FLOWS.map(function(f,i){return '<tr><td data-l="Flow">'+f[0]+'</td><td data-l="Desktop">'+cell(f[1].indexOf('desktop')>-1,i)+'</td><td data-l="Mobile">'+cell(f[1].indexOf('mobile')>-1,i)+'</td><td data-l="API"><span class="api">'+f[2]+'</span></td></tr>'}).join('')+'</tbody></table></div>'+
 '<div class="card"><h2>Vitest component tests</h2><ul>'+VT.map(function(v){return '<li>'+v+' <span class="pass">PASS</span></li>'}).join('')+'</ul></div>'+
 '<div class="card"><h2>Screenshot baselines</h2><p class="hint">One per key screen at each viewport.</p><div class="shots">'+SH.map(function(s){return '<div class="shot"><strong>'+s+'</strong><br>1280 &middot; 375</div>'}).join('')+'</div></div>';
 if(mode==='fail')live('One flow failed on desktop.')}
bindBar('r',function(v){mode=v;draw()});draw();
</script></body></html>
