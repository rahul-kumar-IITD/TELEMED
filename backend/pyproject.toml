[project]
name = "telemed"
version = "0.1.0"
description = "TeleMed appointment booking backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "tzdata>=2024.1",
  "argon2-cffi>=25.1.0",
  "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
markers = ["ac(id): acceptance criterion tag"]

[tool.coverage.run]
source = ["src/telemed"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # generated DDL strings; revisions are immutable

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "telemed"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["telemed.api", "telemed.service", "telemed.repository", "telemed.config", "telemed.types"]

[[tool.importlinter.contracts]]
name = "API must not import Repository or Config"
type = "forbidden"
source_modules = ["telemed.api"]
forbidden_modules = ["telemed.repository", "telemed.config"]
# api -> service -> config is the sanctioned route (service.bootstrap hands config values up)
allow_indirect_imports = true
